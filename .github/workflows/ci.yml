# Pull request gate for main: computes the release version from PR labels, runs the unit tests
# and verifies that the release artifacts build. "Build & test" is the required status check.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to compute the next version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Next version
        id: version
        shell: pwsh
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/ci/Get-NextVersion.ps1 -Labels "$env:PR_LABELS"

      - name: Unit tests
        shell: pwsh
        run: dotnet test tests/Gradiwin.Core.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Stamp version
        shell: pwsh
        run: ./scripts/ci/Set-Version.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Build release artifacts (x64)
        shell: pwsh
        run: ./scripts/ci/Build-Release.ps1 -Version "${{ steps.version.outputs.version }}" -Platform x64 -OutDir artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gradiwin-pr-${{ github.event.pull_request.number || 'manual' }}
          path: artifacts/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
