# Creates a GitHub Release when a pull request is merged into main.
# The bump comes from the merged PR's labels (major / minor / patch, default patch);
# "skip-release" merges without releasing. The version is tracked by vX.Y.Z tags.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for a manual release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      pr: ${{ steps.labels.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Labels of the merged pull request
        id: labels
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          if ($env:MANUAL_BUMP) {
            "labels=$env:MANUAL_BUMP" >> $env:GITHUB_OUTPUT
            "pr=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $prs = gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" | ConvertFrom-Json
          $pr = $prs | Where-Object { $_.merged_at -and $_.base.ref -eq 'main' } | Select-Object -First 1
          if (-not $pr) {
            Write-Host "No merged pull request for ${{ github.sha }}; treating as skip-release."
            "labels=skip-release" >> $env:GITHUB_OUTPUT
            "pr=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $names = ($pr.labels | ForEach-Object { $_.name }) -join ','
          Write-Host "PR #$($pr.number) labels: $names"
          "labels=$names" >> $env:GITHUB_OUTPUT
          "pr=$($pr.number)" >> $env:GITHUB_OUTPUT

      - name: Next version
        id: version
        shell: pwsh
        env:
          PR_LABELS: ${{ steps.labels.outputs.labels }}
        run: ./scripts/ci/Get-NextVersion.ps1 -Labels "$env:PR_LABELS"

  build:
    name: Build (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        if: matrix.platform == 'x64'
        shell: pwsh
        run: dotnet test tests/Gradiwin.Core.Tests -c Release

      - name: Stamp version
        shell: pwsh
        run: ./scripts/ci/Set-Version.ps1 -Version "${{ needs.plan.outputs.version }}"

      - name: Signing certificate
        id: cert
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.MSIX_CERT_PFX }}
        run: |
          if (-not $env:CERT_PFX) { Write-Host "::warning::MSIX_CERT_PFX secret not set; the MSIX will be unsigned."; exit 0 }
          $path = Join-Path $env:RUNNER_TEMP "gradiwin.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_PFX))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Build release artifacts
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: ./scripts/ci/Build-Release.ps1 -Version "${{ needs.plan.outputs.version }}" -Platform ${{ matrix.platform }} -OutDir artifacts -CertificatePath "${{ steps.cert.outputs.path }}" -CertificatePassword "$env:CERT_PASSWORD"

      - name: Remove certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "gradiwin.pfx") -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/

  publish:
    name: Publish GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PR: ${{ needs.plan.outputs.pr }}
        run: |
          notes="Merged via #${PR}."
          [ -z "$PR" ] && notes="Manual release."
          cat > notes.md <<EOF
          ${notes}

          **Downloads**
          - \`Gradiwin-*-portable.zip\`: unzip and run \`Gradiwin.exe\`; no installation needed.
          - \`Gradiwin-*.msix\`: installable package (Print Screen startup, notifications, Share target).
            It is signed with a self-signed certificate: first import \`Gradiwin.cer\` into
            *Local Machine › Trusted People* (double-click › Install Certificate), then open the .msix.
          EOF
          gh release create "$TAG" artifacts/* build/Gradiwin.cer \
            --target "${{ github.sha }}" \
            --title "Gradiwin $TAG" \
            --notes-file notes.md \
            --generate-notes
